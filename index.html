<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>HayGanga · Registro del Rastro</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#1a1033;--pn:#2b1b57;--pn2:#3a2677;--tx:#f4eeff;--mu:#a99bd0;--ac:#ffd23f;--pk:#ff4f8b;--gr:#3ee6c4;--rd:#ff5a5a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 ui-monospace,Menlo,Consolas,monospace;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px);background-size:100% 4px}
.px,button,th{font-family:'Press Start 2P',ui-monospace,monospace}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px;background:var(--pn);border-bottom:4px solid var(--ac)}
h1{font-size:15px;margin:0;color:var(--ac);text-shadow:3px 3px 0 var(--pk)}
.sp{flex:1}
main{max-width:1150px;margin:0 auto;padding:16px}
button,select,input{font:inherit;color:var(--tx)}
button{font-size:10px;background:var(--pk);border:0;padding:11px 13px;cursor:pointer;box-shadow:0 4px 0 #8a1f48;border-radius:2px}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #8a1f48}
button.g{background:var(--gr);color:#07322a;box-shadow:0 4px 0 #1b8e78}
button.y{background:var(--ac);color:#3a2d00;box-shadow:0 4px 0 #a98a00}
button.s{background:var(--pn2);box-shadow:0 4px 0 #1d1240;font-size:9px}
button.on{background:var(--ac);color:#3a2d00}
input,select{background:#12092a;border:2px solid var(--pn2);padding:10px;border-radius:2px;min-width:0;width:100%}
input:focus,select:focus{outline:none;border-color:var(--ac)}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.card{background:var(--pn);border:3px solid var(--pn2);padding:16px;margin-bottom:16px}
.big{padding:30px;text-align:center}
.big h2{font-size:13px;color:var(--gr);line-height:1.8}
.big input{max-width:460px;margin:8px auto 14px;text-align:center;display:block}
.big button{font-size:13px;padding:18px 22px}
.dayinfo{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.dayinfo b{color:var(--ac)}
.form{display:grid;grid-template-columns:1.2fr 1fr 1.6fr 1fr auto;gap:8px;align-items:end}
label{display:block;font-size:11px;color:var(--mu);margin-bottom:4px}
.msg{min-height:20px;margin-top:10px;color:var(--rd);font-weight:bold}
.msg.ok{color:var(--gr)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:700px}
th{font-size:9px;color:var(--ac);text-align:left;padding:10px 8px;border-bottom:3px solid var(--ac);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--pn2)}
tr.done td{background:rgba(62,230,196,.1)}
tr.done .st{color:var(--gr)}
.st{font-weight:bold;color:var(--ac);white-space:nowrap}
input[type=checkbox]{width:24px;height:24px;accent-color:#3ee6c4;cursor:pointer}
.tag{padding:2px 6px;border-radius:2px;background:var(--pn2);white-space:nowrap}
.tag.cm{background:var(--pk)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
.bar>div{flex:1;min-width:150px}
.hide{display:none!important}
.x{background:none;box-shadow:none;color:var(--rd);padding:4px 8px;font-size:12px}
.mu{color:var(--mu)}
@media (max-width:760px){.form{grid-template-columns:1fr 1fr}}
</style></head><body>
<header>
 <h1 class="px">HAYGANGA · RASTRO</h1><span class="sp"></span>
 <span id="who" class="mu"></span>
 <button class="s" id="bMus">♪ MÚSICA: OFF</button>
 <button class="s hide" id="bOut">SALIR</button>
</header>
<main>
<section id="vLogin" class="card big">
 <h2 class="px">ACCESO DE MODS</h2>
 <input id="em" type="email" placeholder="Correo" autocomplete="username">
 <input id="pw" type="password" placeholder="Clave" autocomplete="current-password">
 <button class="y" id="bIn">ENTRAR</button>
 <div class="msg" id="mL"></div>
</section>

<div id="app" class="hide">
<div class="tabs"><button id="tHoy" class="on">HOY</button><button id="tDb" class="s">BASE DE DATOS</button></div>

<section id="vHoy">
 <div id="sinDia" class="card big">
  <h2 class="px">¿EN QUÉ RASTRO ES EL STREAM DE HOY?</h2>
  <input id="rastro" placeholder="Ej: Rastro de Alicante" autocomplete="off">
  <button class="y" id="bEmp">COMIENZA EL RASTRO DE HOY</button>
  <div class="msg" id="m0"></div>
 </div>
 <div id="conDia" class="hide">
  <div class="card">
   <div class="dayinfo"><span class="px" style="font-size:11px;color:var(--gr)">EN DIRECTO</span>
    <span>Rastro: <b id="iR"></b></span><span>Día: <b id="iF"></b></span><span>Inicio: <b id="iH"></b></span><span class="sp"></span>
    <button id="bFin">FINALIZAR EL RASTRO DE HOY</button></div>
   <div class="form">
    <div><label>Comprador (nick)</label><input id="nick" list="dlN" autocomplete="off" placeholder="nick…"></div>
    <div><label>Consola</label><select id="cons"></select></div>
    <div><label>Producto</label><input id="prod" list="dlP" autocomplete="off" placeholder="nombre del juego / producto…"></div>
    <div><label>Puesto</label><select id="pst"><option value="">— Puesto —</option><option>David</option><option>Juan</option><option>Compra del Mes</option></select></div>
    <button class="g" id="bAdd">AÑADIR</button>
   </div>
   <datalist id="dlN"></datalist><datalist id="dlP"></datalist>
   <div class="msg" id="m1"></div>
  </div>
  <div class="card"><div class="tw"><table><thead><tr><th>HORA</th><th>NICK</th><th>CONSOLA</th><th>PRODUCTO</th><th>PUESTO</th><th>BIZUM</th><th>ESTADO</th><th>MOD</th><th></th></tr></thead><tbody id="tbHoy"></tbody></table></div>
   <p id="resHoy" class="mu"></p></div>
 </div>
</section>

<section id="vDb" class="hide">
 <div class="card">
  <div class="bar">
   <div><label>Mes</label><select id="fM"></select></div>
   <div><label>Puesto</label><select id="fP"><option value="">Todos</option><option>David</option><option>Juan</option><option>Compra del Mes</option></select></div>
   <div><label>Estado</label><select id="fE"><option value="">Todos</option><option value="1">COMPRADO</option><option value="0">PENDIENTE</option></select></div>
   <div><label>Buscar (nick, producto, rastro…)</label><input id="fQ" autocomplete="off"></div>
   <button class="g" id="bXl">EXPORTAR A EXCEL</button>
  </div>
  <div class="tw"><table><thead><tr><th>FECHA</th><th>HORA</th><th>RASTRO</th><th>NICK</th><th>CONSOLA</th><th>PRODUCTO</th><th>PUESTO</th><th>ESTADO</th><th>MOD</th></tr></thead><tbody id="tbDb"></tbody></table></div>
  <p id="resDb" class="mu"></p>
  <div class="bar" style="margin-top:14px"><button class="s" id="bImp">IMPORTAR COPIA ANTIGUA (.json)</button><input type="file" id="fImp" accept=".json" class="hide"></div>
 </div>
</section>
</div>
</main>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword,signOut} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import {initializeFirestore,persistentLocalCache,persistentMultipleTabManager,collection,doc,addDoc,setDoc,updateDoc,deleteDoc,getDocs,onSnapshot,query,where,arrayUnion,writeBatch} from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

const app=initializeApp({apiKey:"AIzaSyCH-0IDQLEfOAhau6GjQ9K59U--0fI8eCU",authDomain:"hayganga-rastro.firebaseapp.com",projectId:"hayganga-rastro",storageBucket:"hayganga-rastro.firebasestorage.app",messagingSenderId:"50005506287",appId:"1:50005506287:web:2c75ff97cef3d3020d031a"});
const auth=getAuth(app);
const fs=initializeFirestore(app,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
const $=id=>document.getElementById(id),CM='Compra del Mes';
const CONS=["Atari 2600","Atari 5200","Atari 7800","Atari Lynx","Atari Jaguar","Intellivision","ColecoVision","Magnavox Odyssey","Vectrex","Sega SG-1000","Master System","Game Gear","Mega Drive","Mega CD","Sega 32X","Sega Nomad","Saturn","Dreamcast","NES / Famicom","Famicom Disk System","Super Nintendo","Nintendo 64","GameCube","Wii","Wii U","Switch","Switch 2","Game Boy","Game Boy Color","Game Boy Advance","Virtual Boy","Pokémon Mini","Nintendo DS","Nintendo 3DS / 2DS","PlayStation","PlayStation 2","PlayStation 3","PlayStation 4","PlayStation 5","PSP","PS Vita","Xbox","Xbox 360","Xbox One","Xbox Series X/S","Neo Geo AES","Neo Geo CD","Neo Geo Pocket","PC Engine / TurboGrafx","3DO","Philips CD-i","Amiga CD32","WonderSwan","N-Gage","Steam Deck","Ouya","Amstrad CPC","ZX Spectrum","Commodore 64","MSX","Amiga","PC","Accesorio / Mando","Merchandising","Otros"];
$('cons').innerHTML='<option value="">— Consola —</option>'+CONS.map(c=>`<option>${c}</option>`).join('');
const pad=n=>String(n).padStart(2,'0');
const now=()=>{const d=new Date();return{f:d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),h:pad(d.getHours())+':'+pad(d.getMinutes())}};
const fd=f=>f.split('-').reverse().join('/');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tag=p=>`<span class="tag${p===CM?' cm':''}">${esc(p)}</span>`;
const mapD=s=>s.docs.map(d=>({id:d.id,...d.data()}));
const srt=a=>[...a].sort((x,y)=>(y.f+y.h).localeCompare(x.f+x.h)||(y.creado||0)-(x.creado||0));

let user=null,dia=null,hoyC=[],cmC=[],dbC=[],cat={nicks:[],productos:[],meses:[]},uns=[],unHoy=null,unDb=null;
const who=()=>user.email.split('@')[0];

/* Login */
$('bIn').onclick=async()=>{$('mL').textContent='';try{await signInWithEmailAndPassword(auth,$('em').value.trim(),$('pw').value)}catch(e){$('mL').textContent='Correo o clave incorrectos.'}};
$('pw').onkeydown=e=>{if(e.key==='Enter')$('bIn').click()};
$('bOut').onclick=()=>signOut(auth);
onAuthStateChanged(auth,u=>{user=u;
 $('vLogin').classList.toggle('hide',!!u);$('app').classList.toggle('hide',!u);$('bOut').classList.toggle('hide',!u);$('who').textContent=u?'👤 '+who():'';
 uns.forEach(f=>f());uns=[];if(unHoy)unHoy();if(unDb)unDb();unHoy=unDb=null;
 if(u)start()});

function start(){const mes=now().f.slice(0,7);
 uns.push(onSnapshot(doc(fs,'meta','catalogo'),s=>{cat={nicks:[],productos:[],meses:[],...(s.data()||{})};lists();fillMeses()}));
 uns.push(onSnapshot(query(collection(fs,'compras'),where('mes','==',mes),where('puesto','==',CM)),s=>{cmC=mapD(s)}));
 uns.push(onSnapshot(query(collection(fs,'dias'),where('fin','==',false)),s=>{
  const a=mapD(s).sort((x,y)=>x.creado-y.creado);dia=a[0]||null;if(unHoy){unHoy();unHoy=null}
  if(dia)unHoy=onSnapshot(query(collection(fs,'compras'),where('diaId','==',dia.id)),q=>{hoyC=mapD(q);rHoy()});
  else{hoyC=[];rHoy()}}));
 fillMeses();subDb($('fM').value)}

/* Pestañas */
function tab(t){$('vHoy').classList.toggle('hide',t!=='hoy');$('vDb').classList.toggle('hide',t!=='db');$('tHoy').className=t==='hoy'?'on':'s';$('tDb').className=t==='db'?'on':'s'}
$('tHoy').onclick=()=>tab('hoy');$('tDb').onclick=()=>tab('db');

/* Día */
$('bEmp').onclick=async()=>{const r=$('rastro').value.trim();if(!r){$('m0').textContent='Escribe el nombre del rastro.';return}
 if(dia){alert('Ya hay un rastro en marcha.');return}
 const n=now();await addDoc(collection(fs,'dias'),{f:n.f,h:n.h,rastro:r,fin:false,creado:Date.now(),mod:who()});$('rastro').value='';$('m0').textContent=''};
$('rastro').onkeydown=e=>{if(e.key==='Enter')$('bEmp').click()};
$('bFin').onclick=async()=>{if(!dia)return;const p=hoyC.filter(c=>!c.bizum).length;
 if(!confirm(p?`Quedan ${p} compra(s) sin bizum confirmado. ¿Finalizar igualmente? Seguirán como PENDIENTE.`:'¿Finalizar el rastro de hoy?'))return;
 await updateDoc(doc(fs,'dias',dia.id),{fin:true});tab('db')};

/* Listas de autocompletado */
function lists(){$('dlN').innerHTML=[...cat.nicks].sort((a,b)=>a.localeCompare(b)).map(n=>`<option value="${esc(n)}">`).join('');
 const k=$('cons').value,ps=cat.productos.filter(p=>!k||p.split('||')[0]===k).map(p=>p.split('||')[1]).sort((a,b)=>a.localeCompare(b));
 $('dlP').innerHTML=[...new Set(ps)].map(n=>`<option value="${esc(n)}">`).join('')}
$('cons').onchange=lists;

/* Añadir compra */
async function add(){if(!dia)return;const m=$('m1');m.className='msg';
 let nick=$('nick').value.trim(),cons=$('cons').value,prod=$('prod').value.trim(),pst=$('pst').value;
 if(!nick||!cons||!prod||!pst){m.textContent='Faltan datos: nick, consola, producto y puesto.';return}
 nick=cat.nicks.find(n=>n.toLowerCase()===nick.toLowerCase())||nick;
 const pe=cat.productos.find(p=>p.split('||')[0]===cons&&p.split('||')[1].toLowerCase()===prod.toLowerCase());if(pe)prod=pe.split('||')[1];
 const n=now(),mes=n.f.slice(0,7);
 if(pst===CM){const b=cmC.find(c=>c.nickL===nick.toLowerCase()&&c.mes===mes);
  if(b){const y=+n.f.slice(0,4),mo=+n.f.slice(5,7),nx=mo===12?`1/1/${y+1}`:`1/${mo+1}/${y}`;
   m.textContent=`🔒 ${nick} ya compró en «Compra del Mes» el ${fd(b.f)}. Bloqueado hasta el ${nx}.`;return}}
 try{await addDoc(collection(fs,'compras'),{diaId:dia.id,rastro:dia.rastro,f:n.f,h:n.h,mes,nick,nickL:nick.toLowerCase(),consola:cons,producto:prod,puesto:pst,bizum:false,bh:'',mod:who(),creado:Date.now()});
  await setDoc(doc(fs,'meta','catalogo'),{nicks:arrayUnion(nick),productos:arrayUnion(cons+'||'+prod),meses:arrayUnion(mes)},{merge:true});
  $('nick').value='';$('prod').value='';$('nick').focus();m.className='msg ok';m.textContent=`✔ Anotado: ${nick} · ${prod} (${n.h})`
 }catch(e){m.textContent='No se pudo guardar: '+e.message}}
$('bAdd').onclick=add;
['nick','prod'].forEach(i=>$(i).onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();add()}});

window.tg=id=>{const c=[...hoyC,...dbC].find(x=>x.id===id);if(!c)return;
 updateDoc(doc(fs,'compras',id),{bizum:!c.bizum,bh:c.bizum?'':now().h,bizumPor:c.bizum?'':who()})};
window.del=id=>{if(confirm('¿Borrar esta compra?'))deleteDoc(doc(fs,'compras',id))};

/* Render HOY */
function rHoy(){$('sinDia').classList.toggle('hide',!!dia);$('conDia').classList.toggle('hide',!dia);if(!dia)return;
 $('iR').textContent=dia.rastro;$('iF').textContent=fd(dia.f);$('iH').textContent=dia.h;
 $('tbHoy').innerHTML=srt(hoyC).map(c=>`<tr class="${c.bizum?'done':''}"><td>${c.h}</td><td><b>${esc(c.nick)}</b></td><td>${esc(c.consola)}</td><td>${esc(c.producto)}</td><td>${tag(c.puesto)}</td>
 <td><input type="checkbox" ${c.bizum?'checked':''} onchange="tg('${c.id}')"></td><td class="st">${c.bizum?'COMPRADO':'PENDIENTE'}</td><td class="mu">${esc(c.mod||'')}</td><td><button class="x" onclick="del('${c.id}')">✖</button></td></tr>`).join('')||'<tr><td colspan="9" class="mu">Aún no hay compras hoy.</td></tr>';
 const ok=hoyC.filter(c=>c.bizum).length;$('resHoy').textContent=`${hoyC.length} compra(s) · ${ok} COMPRADO · ${hoyC.length-ok} pendiente(s)`}

/* Base de datos */
function fillMeses(){const cur=now().f.slice(0,7),sel=$('fM').value||cur;
 const ms=[...new Set([...cat.meses,cur])].sort().reverse();
 $('fM').innerHTML=ms.map(m=>`<option value="${m}">${m}</option>`).join('')+'<option value="todo">TODOS (más lecturas)</option>';
 $('fM').value=[...ms,'todo'].includes(sel)?sel:cur}
function subDb(m){if(unDb){unDb();unDb=null}
 if(m==='todo'){getDocs(collection(fs,'compras')).then(s=>{dbC=mapD(s);rDb()});return}
 unDb=onSnapshot(query(collection(fs,'compras'),where('mes','==',m)),s=>{dbC=mapD(s);rDb()})}
$('fM').onchange=()=>subDb($('fM').value);
['fP','fE'].forEach(i=>$(i).onchange=rDb);$('fQ').oninput=rDb;
function filt(){const p=$('fP').value,e=$('fE').value,q=$('fQ').value.trim().toLowerCase();
 return srt(dbC).filter(c=>(!p||c.puesto===p)&&(e===''||(e==='1')===!!c.bizum)&&(!q||[c.nick,c.producto,c.consola,c.rastro].join(' ').toLowerCase().includes(q)))}
function rDb(){const r=filt();
 $('tbDb').innerHTML=r.map(c=>`<tr class="${c.bizum?'done':''}"><td>${fd(c.f)}</td><td>${c.h}</td><td>${esc(c.rastro)}</td><td><b>${esc(c.nick)}</b></td><td>${esc(c.consola)}</td><td>${esc(c.producto)}</td><td>${tag(c.puesto)}</td>
 <td class="st"><label style="display:flex;gap:6px;align-items:center;margin:0;color:inherit"><input type="checkbox" ${c.bizum?'checked':''} onchange="tg('${c.id}')">${c.bizum?'COMPRADO':'PENDIENTE'}</label></td><td class="mu">${esc(c.mod||'')}</td></tr>`).join('')||'<tr><td colspan="9" class="mu">Sin resultados.</td></tr>';
 $('resDb').textContent=`${r.length} registro(s)`}
$('bXl').onclick=()=>{const r=filt().map(c=>({Fecha:fd(c.f),Hora:c.h,Rastro:c.rastro,Nick:c.nick,Consola:c.consola,Producto:c.producto,Puesto:c.puesto,Estado:c.bizum?'COMPRADO':'PENDIENTE','Hora bizum':c.bh||'','Anotado por':c.mod||''}));
 if(!r.length){alert('No hay registros para exportar.');return}
 const nm='compras_rastro_'+now().f;
 if(window.XLSX){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(r),'Compras');XLSX.writeFile(wb,nm+'.xlsx');return}
 const k=Object.keys(r[0]),csv='\ufeff'+[k.join(';'),...r.map(o=>k.map(x=>'"'+String(o[x]).replace(/"/g,'""')+'"').join(';'))].join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=nm+'.csv';a.click()};

/* Importar la copia antigua (versión sin conexión) */
$('bImp').onclick=()=>$('fImp').click();
$('fImp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{
 try{const x=JSON.parse(r.result);if(!x.days)throw 0;const n=x.days.reduce((a,d)=>a+d.compras.length,0);
  if(!confirm(`Se importarán ${x.days.length} día(s) y ${n} compra(s). Los días quedarán cerrados. ¿Continuar?`))return;
  const ops=[],nicks=new Set(),prods=new Set(),meses=new Set();
  x.days.forEach(d=>{const did='imp'+d.id;ops.push([doc(fs,'dias',did),{f:d.f,h:d.h,rastro:d.rastro,fin:true,creado:d.id,mod:'importado'}]);
   d.compras.forEach(c=>{const id='imp'+String(c.id).replace(/\./g,'_'),mes=c.f.slice(0,7);nicks.add(c.nick);prods.add(c.consola+'||'+c.producto);meses.add(mes);
    ops.push([doc(fs,'compras',id),{diaId:did,rastro:d.rastro,f:c.f,h:c.h,mes,nick:c.nick,nickL:c.nick.toLowerCase(),consola:c.consola,producto:c.producto,puesto:c.puesto,bizum:!!c.bizum,bh:c.bh||'',mod:'importado',creado:Math.floor(c.id)}])})});
  for(let i=0;i<ops.length;i+=400){const b=writeBatch(fs);ops.slice(i,i+400).forEach(([ref,d])=>b.set(ref,d));await b.commit()}
  await setDoc(doc(fs,'meta','catalogo'),{nicks:arrayUnion(...nicks),productos:arrayUnion(...prods),meses:arrayUnion(...meses)},{merge:true});
  alert('Importación completada.')}catch(_){alert('No se pudo importar el archivo.')}};r.readAsText(f);e.target.value=''};

/* Música chiptune */
let ac,pl=false,tm,st=0;
const M=[72,76,79,76,72,76,79,84,83,79,76,79,83,79,76,79,77,81,84,81,77,81,84,89,88,84,79,84,88,84,79,76],B=[48,55,53,55,48,55,53,55];
const fr=m=>440*Math.pow(2,(m-69)/12);
function nt(m,ty,v,du){const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type=ty;o.frequency.value=fr(m);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+du);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+du)}
$('bMus').onclick=()=>{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();pl=!pl;$('bMus').textContent='♪ MÚSICA: '+(pl?'ON':'OFF');$('bMus').className=pl?'on':'s';
