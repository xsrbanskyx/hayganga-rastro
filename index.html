<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><title>HayGanga · Registro del Rastro</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#1a1033;--pn:#2b1b57;--pn2:#3a2677;--tx:#f4eeff;--mu:#a99bd0;--ac:#ffd23f;--pk:#ff4f8b;--gr:#3ee6c4;--rd:#ff5a5a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.4 ui-monospace,Menlo,Consolas,monospace;background-image:linear-gradient(rgba(255,255,255,.03) 1px,transparent 1px);background-size:100% 4px}
.px,button,th{font-family:'Press Start 2P',ui-monospace,monospace}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 18px;background:var(--pn);border-bottom:4px solid var(--ac)}
h1{font-size:15px;margin:0;color:var(--ac);text-shadow:3px 3px 0 var(--pk)}
.sp{flex:1}
main{max-width:1150px;margin:0 auto;padding:16px}
button,select,input{font:inherit;color:var(--tx)}
button{font-size:10px;background:var(--pk);border:0;padding:11px 13px;cursor:pointer;box-shadow:0 4px 0 #8a1f48;border-radius:2px}
button:active{transform:translateY(3px);box-shadow:0 1px 0 #8a1f48}
button.g{background:var(--gr);color:#07322a;box-shadow:0 4px 0 #1b8e78}
button.y{background:var(--ac);color:#3a2d00;box-shadow:0 4px 0 #a98a00}
button.s{background:var(--pn2);box-shadow:0 4px 0 #1d1240;font-size:9px}
button.on{background:var(--ac);color:#3a2d00}
input,select{background:#12092a;border:2px solid var(--pn2);padding:10px;border-radius:2px;min-width:0;width:100%}
input:focus,select:focus{outline:none;border-color:var(--ac)}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.card{background:var(--pn);border:3px solid var(--pn2);padding:16px;margin-bottom:16px}
.big{padding:30px;text-align:center}
.big h2{font-size:13px;color:var(--gr);line-height:1.8}
.big input{max-width:460px;margin:8px auto 14px;text-align:center;display:block}
.big button{font-size:13px;padding:18px 22px}
.dayinfo{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.dayinfo b{color:var(--ac)}
.form{display:grid;grid-template-columns:1.2fr 1fr 1.6fr 1fr auto;gap:8px;align-items:end}
label{display:block;font-size:11px;color:var(--mu);margin-bottom:4px}
.msg{min-height:20px;margin-top:10px;color:var(--rd);font-weight:bold}
.msg.ok{color:var(--gr)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;min-width:700px}
th{font-size:9px;color:var(--ac);text-align:left;padding:10px 8px;border-bottom:3px solid var(--ac);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--pn2)}
tr.done td{background:rgba(62,230,196,.1)}
tr.done .st{color:var(--gr)}
.st{font-weight:bold;color:var(--ac);white-space:nowrap}
input[type=checkbox]{width:24px;height:24px;accent-color:#3ee6c4;cursor:pointer}
.tag{padding:2px 6px;border-radius:2px;background:var(--pn2);white-space:nowrap}
.tag.cm{background:var(--pk)}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-bottom:12px}
.bar>div{flex:1;min-width:150px}
.hide{display:none!important}
.x{background:none;box-shadow:none;color:var(--rd);padding:4px 8px;font-size:12px}
.mu{color:var(--mu)}
@media (max-width:760px){.form{grid-template-columns:1fr 1fr}}

:root{--H:min(78vh,720px)}
header,main{position:relative;z-index:1}
.card{background:rgba(43,27,87,.9)}
.form{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
#javi{position:fixed;right:0;bottom:0;height:var(--H);image-rendering:pixelated;opacity:.85;z-index:0;pointer-events:none}
#bub{position:fixed;z-index:30;right:calc(var(--H)*.6);top:calc(100vh - var(--H) + 12px);max-width:250px;min-height:40px;font:9px/1.7 'Press Start 2P',monospace;background:#fff;color:#111;border:4px solid #111;box-shadow:4px 4px 0 var(--pk);padding:10px;opacity:0;transition:opacity .3s;pointer-events:none}
#bub.show{opacity:1}
#bub::after{content:'';position:absolute;right:-20px;top:18px;border:8px solid transparent;border-left:12px solid #111}
#alerta{position:fixed;left:0;right:0;top:0;z-index:100;background:var(--ac);color:#1a1033;padding:18px;font-size:22px;font-weight:bold;display:flex;gap:12px;align-items:center;flex-wrap:wrap;animation:fl .8s infinite alternate}
@keyframes fl{to{background:var(--pk);color:#fff}}
#alerta button{background:#1a1033;color:var(--ac);box-shadow:none}
.av{border-color:var(--ac)}
.avi{font-size:18px;padding:8px 0;border-bottom:1px solid var(--pn2)}
.avi:first-child{color:var(--ac);font-size:20px}
.avi small{color:var(--mu);font-size:12px}
#av input{font-size:18px}
tr.sent td{text-decoration:line-through;opacity:.5}
tr.sent td:last-child{text-decoration:none;opacity:1}
.inv{position:fixed;z-index:60;pointer-events:none}
.lz{position:fixed;z-index:59;height:5px;background:var(--rd);pointer-events:none;box-shadow:0 0 8px var(--rd)}
@media (max-width:760px){:root{--H:46vh}#javi{opacity:.4}#bub{max-width:170px;font-size:8px;right:calc(var(--H)*.5)}}
</style></head><body>
<header>
 <h1 class="px">HAYGANGA · RASTRO</h1><span class="sp"></span>
 <span id="onl" class="mu"></span><span id="who" class="mu"></span><button class="s" id="bJv">JAVI: ON</button>
 <button class="s" id="bMus">♪ MÚSICA: OFF</button>
 <button class="s hide" id="bOut">SALIR</button>
</header>
<main>
<section id="vLogin" class="card big">
 <h2 class="px">ACCESO DE MODS</h2>
 <input id="em" type="email" placeholder="Correo" autocomplete="username">
 <input id="pw" type="password" placeholder="Clave" autocomplete="current-password">
 <button class="y" id="bIn">ENTRAR</button>
 <div class="msg" id="mL"></div>
</section>

<div id="app" class="hide">
<div class="card av" id="av"><div class="px" style="font-size:12px;color:var(--ac);margin-bottom:8px">📢 AVISOS</div><div id="avL"></div>
 <div class="bar" style="margin:10px 0 0"><div style="flex:3"><input id="avT" placeholder="Escribe un aviso para los demás mods…" maxlength="200" autocomplete="off"></div><button class="y" id="bAv">ENVIAR AVISO</button></div>
 <details style="margin-top:10px"><summary class="mu">Frases de Javi (bocadillo)</summary><div class="bar" style="margin-top:8px"><div style="flex:3"><input id="frT" placeholder="Añade una frase de Javi…" maxlength="140" autocomplete="off"></div><button class="s" id="bFr">AÑADIR FRASE</button></div><div id="frL"></div></details></div>
<div class="tabs"><button id="tHoy" class="on">HOY</button><button id="tCo" class="s">COMPRADORES</button><button id="tDb" class="s">BASE DE DATOS</button></div>

<section id="vHoy">
 <div id="sinDia" class="card big">
  <h2 class="px">¿EN QUÉ RASTRO ES EL STREAM DE HOY?</h2>
  <input id="rastro" placeholder="Ej: Rastro de Alicante" autocomplete="off">
  <button class="y" id="bEmp">COMIENZA EL RASTRO DE HOY</button>
  <div class="msg" id="m0"></div>
 </div>
 <div id="conDia" class="hide">
  <div class="card">
   <div class="dayinfo"><span class="px" style="font-size:11px;color:var(--gr)">EN DIRECTO</span>
    <span>Rastro: <b id="iR"></b></span><span>Día: <b id="iF"></b></span><span>Inicio: <b id="iH"></b></span><span class="sp"></span>
    <button id="bFin">FINALIZAR EL RASTRO DE HOY</button></div>
   <div class="form">
    <div><label>Comprador (nick)</label><div style="display:flex;gap:6px"><input id="nick" list="dlN" autocomplete="off" placeholder="nick…"><button class="s" id="bSaveN" style="white-space:nowrap">💾 NICK</button></div></div>
    <div><label>Consola</label><select id="cons"></select></div>
    <div><label>Producto</label><input id="prod" list="dlP" autocomplete="off" placeholder="nombre del juego / producto…"></div>
    <div><label>Puesto</label><select id="pst"><option value="">— Puesto —</option><option>David</option><option>Juan</option><option>Compra del Mes</option></select></div>
    <div><label>Precio (€)</label><input id="precio" inputmode="decimal" placeholder="0,00" autocomplete="off"></div><button class="g" id="bAdd">AÑADIR</button>
   </div>
   <datalist id="dlN"></datalist><datalist id="dlP"></datalist>
   <div style="margin-top:12px"><label style="display:inline-flex;gap:8px;align-items:center;color:var(--tx);font-size:13px"><input type="checkbox" id="pk" style="width:22px;height:22px"> PACK (varios artículos, un solo precio y un solo bizum)</label>
    <button class="s hide" id="bPk">+ AÑADIR ARTÍCULO AL PACK</button><div id="pkL" style="margin-top:8px"></div></div>
   <div class="msg" id="m1"></div>
  </div>
  <div class="card"><div class="tw"><table><thead><tr><th>HORA</th><th>NICK</th><th>CONSOLA</th><th>PRODUCTO</th><th>PUESTO</th><th>€</th><th>BIZUM</th><th>ESTADO</th><th>MOD</th><th></th></tr></thead><tbody id="tbHoy"></tbody></table></div>
   <p id="resHoy" class="mu"></p></div>
 </div>
</section>

<section id="vCo" class="hide"><div class="card"><div class="bar"><div><label>Buscar nick</label><input id="cQ" autocomplete="off"></div><button class="g" id="bXc">EXPORTAR NICKS A EXCEL</button></div>
 <div class="tw"><table><thead><tr><th>NICK</th><th>COMPRAS</th><th>GASTADO</th><th>ALTA</th><th>ÚLTIMA</th><th>GUARDADO POR</th></tr></thead><tbody id="tbCo"></tbody></table></div><p id="resCo" class="mu"></p></div></section>
<section id="vDb" class="hide">
 <div class="card">
  <div class="bar">
   <div><label>Mes</label><select id="fM"></select></div>
   <div><label>Puesto</label><select id="fP"><option value="">Todos</option><option>David</option><option>Juan</option><option>Compra del Mes</option></select></div>
   <div><label>Estado</label><select id="fE"><option value="">Todos</option><option value="1">COMPRADO</option><option value="0">PENDIENTE</option></select></div>
   <div><label>Wallapop</label><select id="fW"><option value="">Todos</option><option value="1">ENVIADO</option><option value="0">POR ENVIAR</option></select></div>
   <div><label>Buscar (nick, producto, rastro…)</label><input id="fQ" autocomplete="off"></div>
   <button class="g" id="bXl">EXPORTAR A EXCEL</button>
  </div>
  <div class="tw"><table><thead><tr><th>FECHA</th><th>HORA</th><th>RASTRO</th><th>NICK</th><th>CONSOLA</th><th>PRODUCTO</th><th>PUESTO</th><th>€</th><th>ESTADO</th><th>MOD</th><th>WALLAPOP</th></tr></thead><tbody id="tbDb"></tbody></table></div>
  <p id="resDb" class="mu"></p>
  <div class="bar" style="margin-top:14px"><button class="s" id="bImp">IMPORTAR COPIA ANTIGUA (.json)</button><input type="file" id="fImp" accept=".json" class="hide"></div>
 </div>
</section>
</div>
</main>

/* Añadir compra */
const num=v=>{const x=parseFloat(String(v).replace(',','.'));return isNaN(x)?null:Math.round(x*100)/100};
const bid=n=>encodeURIComponent(n.toLowerCase()).replace(/\./g,'%2E');
const canon=n=>cat.nicks.find(x=>x.toLowerCase()===n.toLowerCase())||n;
const eur=n=>n==null||n===''?'—':Number(n).toFixed(2).replace('.',',')+' €';
const prodCell=c=>c.pack&&c.items?'<span class="tag" style="background:var(--ac);color:#3a2d00">PACK '+c.items.length+'</span>'+c.items.map(i=>`<div>${esc(i.producto)} <span class="mu">(${esc(i.consola)})</span></div>`).join(''):esc(c.producto);
function curItem(){const cons=$('cons').value,prod=$('prod').value.trim();if(!cons||!prod)return null;
 const pe=cat.productos.find(p=>p.split('||')[0]===cons&&p.split('||')[1].toLowerCase()===prod.toLowerCase());return{consola:cons,producto:pe?pe.split('||')[1]:prod}}
function rPk(){$('pkL').innerHTML=pack.map((p,i)=>`<span class="tag">${esc(p.producto)} · ${esc(p.consola)} <a href="#" onclick="pkDel(${i});return false" style="color:var(--rd)">✖</a></span> `).join('')}
window.pkDel=i=>{pack.splice(i,1);rPk()};
$('pk').onchange=()=>{$('bPk').classList.toggle('hide',!$('pk').checked);if(!$('pk').checked){pack=[];rPk()}};
$('bPk').onclick=()=>{const it=curItem();if(!it){$('m1').className='msg';$('m1').textContent='Elige consola y producto para el pack.';return}pack.push(it);$('prod').value='';$('prod').focus();rPk()};
$('bSaveN').onclick=async()=>{const m=$('m1');let nick=$('nick').value.trim();if(!nick){m.className='msg';m.textContent='Escribe el nick primero.';return}
 nick=canon(nick);const ex=cat.nicks.some(x=>x.toLowerCase()===nick.toLowerCase());
 await setDoc(doc(fs,'compradores',bid(nick)),{nick,nickL:nick.toLowerCase(),...(ex?{}:{alta:now().f,mod:who()})},{merge:true});
 await setDoc(doc(fs,'meta','catalogo'),{nicks:arrayUnion(nick)},{merge:true});
 m.className='msg ok';m.textContent=ex?`${nick} ya estaba guardado.`:`💾 Nick guardado: ${nick}`};
async function add(){if(!dia)return;const m=$('m1');m.className='msg';
 let nick=$('nick').value.trim(),pst=$('pst').value,precio=num($('precio').value),isPack=$('pk').checked,cur=curItem(),items=[...pack];
 if(cur)isPack?items.push(cur):(items=[cur]);
 if(!nick||!pst||!items.length){m.textContent='Faltan datos: nick, consola, producto y puesto.';return}
 if(precio===null||precio<0){m.textContent='Pon el precio en € (ej: 12,50).';return}
 if(isPack&&items.length<2){m.textContent='Un pack necesita 2 artículos o más (usa «+ AÑADIR ARTÍCULO AL PACK»).';return}
 nick=canon(nick);const n=now(),mes=n.f.slice(0,7),nuevo=!cat.nicks.some(x=>x.toLowerCase()===nick.toLowerCase());
 if(pst===CM){const b=cmC.find(c=>c.nickL===nick.toLowerCase()&&c.mes===mes);
  if(b){const y=+n.f.slice(0,4),mo=+n.f.slice(5,7),nx=mo===12?`1/1/${y+1}`:`1/${mo+1}/${y}`;
   m.textContent=`🔒 ${nick} ya compró en «Compra del Mes» el ${fd(b.f)}. Bloqueado hasta el ${nx}.`;return}}
 const producto=isPack?'PACK ('+items.length+'): '+items.map(i=>i.producto).join(' + '):items[0].producto,consola=[...new Set(items.map(i=>i.consola))].join(' / ');
 try{await addDoc(collection(fs,'compras'),{diaId:dia.id,rastro:dia.rastro,f:n.f,h:n.h,mes,nick,nickL:nick.toLowerCase(),consola,producto,items,pack:isPack,precio,puesto:pst,bizum:false,bh:'',mod:who(),creado:Date.now()});
  await setDoc(doc(fs,'meta','catalogo'),{nicks:arrayUnion(nick),productos:arrayUnion(...items.map(i=>i.consola+'||'+i.producto)),meses:arrayUnion(mes)},{merge:true});
  await setDoc(doc(fs,'compradores',bid(nick)),{nick,nickL:nick.toLowerCase(),compras:increment(1),gasto:increment(precio),ultima:n.f,...(nuevo?{alta:n.f,mod:who()}:{})},{merge:true});
  $('nick').value='';$('prod').value='';$('precio').value='';pack=[];$('pk').checked=false;$('bPk').classList.add('hide');rPk();$('nick').focus();
  m.className='msg ok';m.textContent=`✔ Anotado: ${nick} · ${producto} · ${eur(precio)} (${n.h})`
 }catch(e){m.textContent='No se pudo guardar: '+e.message}}
$('precio').onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();add()}};
$('bAdd').onclick=add;

 const ms=[...new Set([...cat.meses,cur])].sort().reverse();

function filt(){const p=$('fP').value,e=$('fE').value,w=$('fW').value,q=$('fQ').value.trim().toLowerCase();
 return srt(dbC).filter(c=>(!p||c.puesto===p)&&(e===''||(e==='1')===!!c.bizum)&&(w===''||(w==='1')===!!c.enviado)&&(!q||[c.nick,c.producto,c.consola,c.rastro].join(' ').toLowerCase().includes(q)))}
function rDb(){const r=filt();
 $('tbDb').innerHTML=r.map(c=>`<tr class="${c.enviado?'sent':c.bizum?'done':''}"><td>${fd(c.f)}</td><td>${c.h}</td><td>${esc(c.rastro)}</td><td><b>${esc(c.nick)}</b></td><td>${esc(c.consola)}</td><td>${prodCell(c)}</td><td>${tag(c.puesto)}</td><td>${eur(c.precio)}</td>
 <td class="st"><label style="display:flex;gap:6px;align-items:center;margin:0;color:inherit"><input type="checkbox" ${c.bizum?'checked':''} onchange="tg('${c.id}')">${c.bizum?'COMPRADO':'PENDIENTE'}</label></td><td class="mu">${esc(c.mod||'')}</td>
 <td>${c.enviado?`<span class="st" style="color:var(--gr)">ENVIADO ✔</span> <button class="x" style="color:var(--mu)" onclick="undoW('${c.id}')">↺</button>`:c.cerrado&&c.bizum?`<button class="y" style="font-size:8px" onclick="envW('${c.id}',this)">ENVIADO ENLACE DE WALLAPOP</button>`:'<span class="mu">—</span>'}</td></tr>`).join('')||'<tr><td colspan="11" class="mu">Sin resultados.</td></tr>';
 $('resDb').textContent=`${r.length} registro(s) · Total ${eur(r.reduce((a,c)=>a+(c.precio||0),0))}`}
$('bXl').onclick=()=>{const r=filt().map(c=>({Fecha:fd(c.f),Hora:c.h,Rastro:c.rastro,Nick:c.nick,Consola:c.consola,Producto:c.producto,Puesto:c.puesto,Estado:c.bizum?'COMPRADO':'PENDIENTE','Hora bizum':c.bh||'','Anotado por':c.mod||'','Precio (€)':c.precio??'',Tipo:c.pack?'PACK':'Individual','Enlace Wallapop':c.enviado?'ENVIADO':'POR ENVIAR'}));
 if(!r.length){alert('No hay registros para exportar.');return}
 const nm='compras_rastro_'+now().f;
 if(window.XLSX){const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.json_to_sheet(r),'Compras');XLSX.writeFile(wb,nm+'.xlsx');return}
 const k=Object.keys(r[0]),csv='\ufeff'+[k.join(';'),...r.map(o=>k.map(x=>'"'+String(o[x]).replace(/"/g,'""')+'"').join(';'))].join('\n');
 const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download=nm+'.csv';a.click()};

/* Importar la copia antigua (versión sin conexión) */
$('bImp').onclick=()=>$('fImp').click();
$('fImp').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=async()=>{
 try{const x=JSON.parse(r.result);if(!x.days)throw 0;const n=x.days.reduce((a,d)=>a+d.compras.length,0);
  if(!confirm(`Se importarán ${x.days.length} día(s) y ${n} compra(s). Los días quedarán cerrados. ¿Continuar?`))return;
  const ops=[],nicks=new Set(),prods=new Set(),meses=new Set();
  x.days.forEach(d=>{const did='imp'+d.id;ops.push([doc(fs,'dias',did),{f:d.f,h:d.h,rastro:d.rastro,fin:true,creado:d.id,mod:'importado'}]);
   d.compras.forEach(c=>{const id='imp'+String(c.id).replace(/\./g,'_'),mes=c.f.slice(0,7);nicks.add(c.nick);prods.add(c.consola+'||'+c.producto);meses.add(mes);
    ops.push([doc(fs,'compras',id),{diaId:did,rastro:d.rastro,f:c.f,h:c.h,mes,nick:c.nick,nickL:c.nick.toLowerCase(),consola:c.consola,producto:c.producto,puesto:c.puesto,bizum:!!c.bizum,bh:c.bh||'',mod:'importado',cerrado:true,creado:Math.floor(c.id)}])})});
  for(let i=0;i<ops.length;i+=400){const b=writeBatch(fs);ops.slice(i,i+400).forEach(([ref,d])=>b.set(ref,d));await b.commit()}
  await setDoc(doc(fs,'meta','catalogo'),{nicks:arrayUnion(...nicks),productos:arrayUnion(...prods),meses:arrayUnion(...meses)},{merge:true});
  alert('Importación completada.')}catch(_){alert('No se pudo importar el archivo.')}};r.readAsText(f);e.target.value=''};

function blip(f,d){const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type='square';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f/4,t+d);g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+d)}
window.envW=async(id,btn)=>{const r=btn.closest('tr').getBoundingClientRect(),y=r.top+r.height/2,D=1100,w=r.width-40;
 const s=document.createElement('div'),l=document.createElement('div');s.className='inv';s.innerHTML=SHIP;l.className='lz';
 s.style.cssText=`left:${r.left}px;top:${y-12}px`;l.style.cssText=`left:${r.left}px;top:${y-2}px;width:0`;document.body.append(s,l);
 s.animate([{transform:'translateX(0)'},{transform:`translateX(${w}px)`}],{duration:D,easing:'linear',fill:'forwards'});
 l.animate([{width:'0px'},{width:(w+20)+'px'}],{duration:D,easing:'linear',fill:'forwards'});
 try{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();ac.resume();for(let i=0;i<6;i++)setTimeout(()=>blip(1200-i*100,.12),i*180)}catch(e){}
 await new Promise(res=>setTimeout(res,D+150));s.remove();l.remove();
 await updateDoc(doc(fs,'compras',id),{enviado:true,enviadoPor:who(),enviadoF:now().f})};

/* Música chiptune */
let ac,pl=false,tm,st=0;
const M=[72,76,79,76,72,76,79,84,83,79,76,79,83,79,76,79,77,81,84,81,77,81,84,89,88,84,79,84,88,84,79,76],B=[48,55,53,55,48,55,53,55];
const fr=m=>440*Math.pow(2,(m-69)/12);
function nt(m,ty,v,du){const o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;o.type=ty;o.frequency.value=fr(m);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+du);o.connect(g).connect(ac.destination);o.start(t);o.stop(t+du)}
$('bMus').onclick=()=>{if(!ac)ac=new(window.AudioContext||window.webkitAudioContext)();pl=!pl;$('bMus').textContent='♪ MÚSICA: '+(pl?'ON':'OFF');$('bMus').className=pl?'on':'s';
 if(pl){ac.resume();tm=setInterval(()=>{nt(M[st%32],'square',.05,.16);if(st%4===0)nt(B[(st/4)%8]-12,'triangle',.12,.4);if(st%2===0)nt(100,'sawtooth',.02,.04);st++},170)}else clearInterval(tm)};
